<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a463c" />
      <stop offset="60%" stop-color="#0f8672" />
      <stop offset="100%" stop-color="#09352e" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines & rings -->
  <circle cx="1050" cy="150" r="320" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <circle cx="1050" cy="150" r="220" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="150" cy="550" r="280" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Brand Pill -->
  <g transform="translate(80, 80)">
    <rect width="260" height="46" rx="23" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="28" cy="23" r="10" fill="#2dd4bf" />
    <text x="48" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      NURSE CARE CLINICAL
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Trained Nurses for
  </text>
  <text x="80" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#5eead4" letter-spacing="-1">
    Compassionate Care at Home
  </text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#ccfbf1" width="800">
    Council-registered nursing care for elderly recovery, post-surgery rehabilitation,
  </text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#ccfbf1" width="800">
    and sterile hospital-grade bedside interventions in your familiar home environment.
  </text>

  <!-- Stats Grid -->
  <g transform="translate(80, 440)">
    <rect width="1040" height="110" rx="20" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Stat 1 -->
    <text x="40" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">100%</text>
    <text x="40" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#99f6e4">COUNCIL ACCREDITED</text>

    <!-- Divider -->
    <line x1="280" y1="25" x2="280" y2="85" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Stat 2 -->
    <text x="320" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">2 - 4 Hrs</text>
    <text x="320" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#99f6e4">RAPID DISPATCH ETA</text>

    <!-- Divider -->
    <line x1="580" y1="25" x2="580" y2="85" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Stat 3 -->
    <text x="620" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">4.9 / 5.0</text>
    <text x="620" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#99f6e4">PATIENT FAMILY SCORE</text>

    <!-- Divider -->
    <line x1="860" y1="25" x2="860" y2="85" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Stat 4 -->
    <text x="900" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff">24 / 7</text>
    <text x="900" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#99f6e4">CLINICAL HELPLINE</text>
  </g>
</svg>
